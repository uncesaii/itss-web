<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — ITSS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --ink: #333333;
        --muted: #666666;
        --soft: #fbfbfb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: var(--soft);
        color: var(--ink);
        font-family: Roboto, system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 560px;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 48px);
        font-weight: 300;
      }

      a {
        display: inline-block;
        margin-top: 32px;
        padding: 14px 28px;
        background: var(--ink);
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-decoration: none;
        text-transform: uppercase;
      }

      a:hover {
        background: #000000;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
